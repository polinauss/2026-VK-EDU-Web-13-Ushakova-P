<div class="card mb-4">
    <div class="card-header">Popular Tags</div>
    <div class="card-body">
        {% for tag in popular_tags %}
            <a href="{% url 'questions:tag' tag.name %}" class="badge bg-primary me-1">{{ tag.name }}</a>
        {% empty %}
            <span class="text-muted">No tags yet.</span>
        {% endfor %}
    </div>
</div>

<div class="card">
    <div class="card-header">Best Members</div>
    <div class="card-body">
        <ul class="list-unstyled">
            <li><a href="#">Mr. Freeman</a></li>
            <li><a href="#">Dr. House</a></li>
            <li><a href="#">Bender</a></li>
            <li><a href="#">Queen Victoria</a></li>
            <li><a href="#">V. Pupkin</a></li>
        </ul>
    </div>
</div>
