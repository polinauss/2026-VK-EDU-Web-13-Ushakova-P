{% load static %}
<div class="card mb-3">
    <div class="card-body">
        <div class="d-flex">
            <div class="me-3 text-center">
                <img src="{% static 'img/avatar.jpg' %}" width="50" height="50" class="rounded">
                <div class="mt-2">
                    <span class="badge bg-success">{{ answer.likes|default:5 }}</span>
                </div>
            </div>
            <div class="flex-grow-1">
                <p>{{ answer.text }}</p>
                {% if answer.is_correct %}
                    <span class="text-success fw-bold">✔ Correct!</span>
                {% endif %}
            </div>
        </div>
    </div>
</div>
