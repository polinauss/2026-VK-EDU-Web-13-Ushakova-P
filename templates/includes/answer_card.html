{% load static %}
<div class="card mb-3" id="answer-{{ answer.id }}">
    <div class="card-body">
        <div class="d-flex">
            <div class="me-3 text-center">
                {% if answer.author.profile.avatar %}
                    <img src="{{ answer.author.profile.avatar.url }}" width="50" height="50" class="rounded">
                {% else %}
                    <img src="{% static 'img/avatar.png' %}" width="50" height="50" class="rounded">
                {% endif %}
                <div class="mt-2">
                    {% if user.is_authenticated %}
                        <button class="btn btn-sm btn-outline-danger like-btn" data-id="{{ answer.id }}" data-type="answer">
                            ❤
                        </button>
                        <span class="mx-1 fw-bold likes-count">{{ answer.likes_count }}</span>
                    {% else %}
                        <button class="btn btn-sm btn-outline-danger" disabled title="Войдите, чтобы оценить">
                            ❤
                        </button>
                        <span class="mx-1 fw-bold">{{ answer.likes_count }}</span>
                    {% endif %}
                </div>
            </div>
            <div class="flex-grow-1">
                <p>{{ answer.text }}</p>
                {% if answer.is_correct %}
                    <span class="text-success fw-bold">✔ Correct!</span>
                {% endif %}
                <p class="text-muted small">answered by {{ answer.author.username }}</p>
            </div>
        </div>
    </div>
</div>
