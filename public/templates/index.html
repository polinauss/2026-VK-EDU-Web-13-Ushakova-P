{% extends "base.html" %}

{% block content %}

<h3>New Questions</h3>

<div class="question-card">
    <img src="{% static 'img/avatar.png' %}">
    <div>
        <h4><a href="{% url 'question' %}">How to build a moon park ?</a></h4>
        <p>Guys, i have trouble...</p>

        <div class="likes">
            <button onclick="like(this)">▲</button>
            <span>5</span>
            <button onclick="dislike(this)">▼</button>
        </div>
    </div>
</div>

<div class="pagination">
    <button>1</button>
    <button>2</button>
    <button>3</button>
</div>

{% endblock %}
